services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamento-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agendamento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts .sql daqui rodam na primeira inicialização (cria o banco de teste).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agendamento"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
