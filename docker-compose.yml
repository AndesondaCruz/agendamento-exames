# Ambiente completo com um comando:
#   docker compose up --build        -> banco + API + front
#   docker compose up -d postgres redis -> só banco e cache (para desenvolver com npm run start:dev)
#
# Front:   http://localhost:8080
# API:     http://localhost:3000/api   (Swagger em /api/docs)
#
# As credenciais abaixo são APENAS para desenvolvimento local.
services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamento-db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: agendamento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts .sql daqui rodam na primeira inicialização (cria o banco de teste).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agendamento"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: agendamento-cache
    # Cache é descartável, então:
    #  - sem persistência em disco (--save "" e --appendonly no);
    #  - limite de 64 MB; ao encher, descarta primeiro as chaves que expiram
    #    mais cedo (volatile-ttl). Assim os contadores de versão, que têm
    #    validade longa, são os últimos a sair.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-ttl
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    container_name: agendamento-api
    environment:
      NODE_ENV: production
      PORT: 3000
      # "postgres" é o nome do serviço acima: o DNS interno do Docker resolve.
      DATABASE_URL: postgresql://app:app@postgres:5432/agendamento
      DATABASE_SSL: "false"
      CORS_ORIGIN: http://localhost:8080
      CLINIC_TIMEZONE: America/Sao_Paulo
      RUN_SEED: "true"
      # Opcional: sem ela (ou vazia), a API usa cache em memória.
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        # Espera o banco ACEITAR conexões, não só o container iniciar.
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    container_name: agendamento-web
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
